services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestao_medica_app
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - gestao_medica_network
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: gestao_medica_web
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gestao_medica_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: gestao_medica_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD} 
      MYSQL_DATABASE: ${DB_DATABASE}      
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - gestao_medica_network

  npm:
    image: node:14
    container_name: laravel_npm
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - gestao_medica_network
    command: ["npm", "install"]
    entrypoint: ["npm", "run", "dev"]

networks:
  gestao_medica_network:
    driver: bridge

volumes:
  db_data:
